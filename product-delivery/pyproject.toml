[project]
name = "product-delivery"
version = "1.0.0"
description = "MCP server for the product-delivery lifecycle skill — a hierarchical state machine for software products from intake through stabilization."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Michael Kerr" },
]
keywords = [
    "mcp",
    "product",
    "delivery",
    "lifecycle",
    "state-machine",
    "ai-coding",
]
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
product-delivery = "product_delivery.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_delivery"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "references/",
    "templates/",
    "schemas/",
    "evals/",
    "SKILL.md",
    "README.md",
    "pyproject.toml",
]
